<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Page not found</title>
<style>
  :root { --bg: #fafaf8; --fg: #1c1c1a; --muted: #6b6b66; }
  @media (prefers-color-scheme: dark) { :root { --bg: #141413; --fg: #ececea; --muted: #9a9a95; } }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 16px; }
  h1 { font-weight: 500; font-size: 1.5rem; margin: 0 0 .4rem; letter-spacing: .01em; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>This page does not exist.</p>
</main>
</body>
</html>
